version: "3.8"

services:
  app:
    build: .
    container_name: partworks-be
    restart: unless-stopped
    environment:
      - TZ=Asia/Jakarta
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - partworks-net
    # Uncomment for production with resource limits
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 256M

networks:
  partworks-net:
    driver: bridge
