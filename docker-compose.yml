version: "3.8"

services:
  app:
    build: .
    container_name: partworks-be
    restart: unless-stopped
    environment:
      - TZ=Asia/Jakarta
      - CONNECTION_STRING=${CONNECTION_STRING}
      - DATABASE_URL=${DATABASE_URL}
      - AUTO_MIGRATE=${AUTO_MIGRATE}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=${PORT}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_BUCKET=${R2_BUCKET}
      - R2_REGION=${R2_REGION}
      - R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL}
      - R2_FORCE_PATH_STYLE=${R2_FORCE_PATH_STYLE}
      - R2_EC2_METADATA_DISABLED=${R2_EC2_METADATA_DISABLED}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - partworks-net
    # Uncomment for production with resource limits
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 256M

networks:
  partworks-net:
    driver: bridge
